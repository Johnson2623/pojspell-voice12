const ruleSamplePools={"1":["a","e","i","o","o͘","u","ai","au","ia","iau","io","io͘","iu","oa","oai","oe","ui","ng"],"2":["á","é","í","ó","ó͘","ú","ái","áu","iá","iáu","ió","ió͘","iú","oá","oái","oé","uí","ńg"],"3":["à","è","ì","ò","ò͘","ù","ài","àu","ià","iàu","iò","iò͘","iù","oà","oài","oè","uì","ǹg"],"4":["ah","eh","ih","oh","o͘h","uh","aih","auh","iah","iauh","ioh","iuh","oah","oeh","uih"],"5":["â","ê","î","ô","ô͘","û","âi","âu","iâ","iâu","iô","iô͘","iû","oâ","oâi","oê","uî","n̂g"],"7":["ā","ē","ī","ō","ō͘","ū","āi","āu","iā","iāu","iō","iō͘","iū","oā","oāi","oē","uī","n̄g"],"8":["a̍h","e̍h","i̍h","o̍h","o̍͘h","u̍h","a̍ih","a̍uh","ia̍h","ia̍uh","io̍h","iu̍h","oa̍h","oe̍h","ui̍h"]};

function ruleSampleOutput(text,target){

}
function pickRuleSample(index){

let ruleSelected=0;
function currentWord(){return activeMode==='principles'?ruleWords[ruleSelected]:words[selected]}
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
const contours={1:[5,5],2:[5,1],3:[2,1],4:[2,1],5:[2,4],7:[3,3],8:[4,4]};

function curve(t,left){const c=contours[t],short=t===4||t===8;return [left,70+(5-c[0])*66,left+(short?115:190),70+(5-c[1])*66]}
function path(c){return `M ${c[0]} ${c[1]} L ${c[2]} ${c[3]}`}
for(let v=1;v<=5;v++){const y=17.5+(5-v)*33;const l=document.createElementNS(ns,'line');for(const [a,b]of Object.entries({x1:58,x2:662,y1:y,y2:y,stroke:'#3b3730','stroke-width':1.5}))l.setAttribute(a,b);$('grid').append(l);const t=document.createElementNS(ns,'text');t.setAttribute('x',20);t.setAttribute('y',y+6);t.setAttribute('fill','#aaa396');t.setAttribute('font-size',19);t.textContent=v;$('grid').append(t)}
randomizeWords();
for(const rowId of ['words','practiceWords'])words.forEach((w,i)=>{const b=document.createElement('button');b.textContent=w.h;b.onclick=()=>choose(i,rowId==='practiceWords'?'practice':'animation');$(rowId).append(b)});
ruleWords.forEach((w,i)=>{const b=document.createElement('button');b.textContent=`${w.t} → ${w.to}`;b.onclick=()=>chooseRule(i);$('principlesWords').append(b)});
function firstCurve(w){return w.t===8?[175,70,175,169]:w.t===2?[121.5625,276.25,228.4375,127.75]:w.t===3?firstCurve({t:2}).map((n,i)=>i%2?404-n:n):w.t===7?[80,202,270,202]:curve(w.t,80)}
function rotateLine(a,radians){const cx=(a[0]+a[2])/2,cy=(a[1]+a[3])/2,c=Math.cos(radians),s=Math.sin(radians);return a.map((n,i)=>i%2?cy+(a[i-1]-cx)*s+(n-cy)*c:cx+(n-cx)*c-(a[i+1]-cy)*s)}
function roofPath(apexY){return `M 80 202 L 175 ${apexY} L 270 202`}
function paintFirstLabel(w){
 if(activeMode==='principles')w=ruleSample;
 const label=$('firstLabel'),text=p>=.5?w.out:w.a;label.textContent=text;if(p<.5)return;

 label.innerHTML=letters.map((letter,i)=>i===index?`<span class="changed-vowel">${letter}</span>`:letter).join('');
}
function ruleToneSymbol(tone){
 const symbols={2:'M 15 32 L 45 8',3:'M 15 8 L 45 32',5:'M 10 30 L 30 10 L 50 30',7:'M 10 20 L 50 20',8:'M 30 8 L 30 32'};
 if(!symbols[tone])return `<span class="rule-tone-blank" role="img" aria-label="第 ${tone} 調：空白"></span>`;
 return `<svg class="rule-tone-symbol" viewBox="0 0 60 40" role="img" aria-label="第 ${tone} 調聲調符號"><path d="${symbols[tone]}"/></svg>`;
}
function paintSpelling(w){
 const row=$('poj');
 if(activeMode==='principles'){
  row.className='poj poj-double rule-tone-pair'+([1,7,3,5,4].includes(w.t)?' is-large':'')+(w.t===2?' is-double':'')+([1,7,3,5,4,8].includes(w.t)?' is-raised-small':'');
  row.innerHTML=ruleToneSymbol(w.t)+'<span class="rule-tone-arrow" role="img" aria-label="→"><span class="arrow-spacer" aria-hidden="true">→</span><svg viewBox="0 0 60 60" aria-hidden="true"><path d="M 5 30 H 55 M 41 16 L 55 30 L 41 44"/></svg></span><span class="rule-target-symbol">'+ruleToneSymbol(w.to)+'</span>';
 }else{row.className='poj poj-double';row.textContent=`${w.source} → ${w.out}${w.separator}${w.b}`}
}
function paintRuleGraphSample(){
 const sample=$('ruleOneGraphSample');
 sample.hidden=activeMode!=='principles';
 if(sample.hidden)return;
 sample.textContent=p>=.5?ruleSample.out:ruleSample.a;
 sample.className='rule-one-graph-sample'+(p>=.5?' is-changed':'');
 // 以實際畫面座標為準：右側白話字的垂直中心與左側「變音前」白話字的中心同高。
 // 使用實際元素的位置，避免字體大小和不同手機寬度造成偏差。
 const first=$('firstLabel');
 const wrap=$('toneGraphWrap');
 if(first && wrap){
  const firstRect=first.getBoundingClientRect();
  const wrapRect=wrap.getBoundingClientRect();
  sample.style.top=(firstRect.top+firstRect.height/2-wrapRect.top)+'px';

}
function paint(){const w=currentWord(),a=firstCurve(w),b=curve(w.to,80),ease=p*p*(3-2*p);$('changing').setAttribute('opacity',1);if(w.t===8){const travel=Math.max(0,Math.min(1,(p-.15)/.85)),drop=travel*travel*(3-2*travel)*320;$('changing').setAttribute('clip-path','url(#plotClip)');$('changing').setAttribute('d',path([175,70+drop,175,169+drop]))}else if(w.t===4){const travel=Math.max(0,Math.min(1,(p-.15)/.85)),drop=travel*travel*(3-2*travel),bottomY=70+198*drop;$('changing').setAttribute('clip-path','url(#plotClip)');$('changing').setAttribute('opacity',p<=.15?0:1);$('changing').setAttribute('d',path([175,bottomY-80,175,bottomY]))}else if(w.t===5){$('changing').setAttribute('clip-path','none');$('changing').setAttribute('d',roofPath(107+95*ease))}else if(w.t===3||w.t===7){$('changing').setAttribute('clip-path','none');$('changing').setAttribute('d',path(rotateLine(a,(w.t===7?Math.PI/4:-2*Math.atan2(a[3]-a[1],a[2]-a[0]))*ease)))}else if(w.t===2){const travel=Math.max(0,(p-.2)/.8),offset=travel*travel*(3-2*travel);$('changing').setAttribute('d',path(a.map((n,i)=>n+(i%2?500:-360)*offset)));$('changing').setAttribute('clip-path','url(#plotClip)')}else{$('changing').setAttribute('clip-path','none');$('changing').setAttribute('d',path(a.map((n,i)=>n+(b[i]-n)*ease)))}paintFirstLabel(w);paintSpelling(w);paintRuleGraphSample()}
let refreshTimer=0;
function stopRefresh(){clearTimeout(refreshTimer);refreshTimer=0}
function scheduleRefresh(){
 stopRefresh();
 const refreshMode=activeMode,refreshIndex=selected;
 refreshTimer=setTimeout(()=>{
  refreshTimer=0;
  if(activeMode!==refreshMode)return;
  if(refreshMode==='principles'){chooseRule(ruleSelected);return;}
  // Pick one of the other six columns, not just a new word in the same column.
  const otherColumns=words.map((_,i)=>i).filter(i=>i!==refreshIndex);
  const nextIndex=otherColumns[Math.floor(Math.random()*otherColumns.length)];
  randomizeWords();
  if(refreshMode==='practice'&&!$('quizArea').hidden){
   const position=order.indexOf(nextIndex);
   [order[q],order[position]]=[order[position],order[q]];
  }
  choose(nextIndex,refreshMode,false);
 },Number($('speed').value));
}
function halt(){cancelAnimationFrame(frame);running=false}
function tick(now){if(!running)return;if(last)p=Math.min(1,p+(now-last)/Number($('speed').value));last=now;paint();if(p<1)frame=requestAnimationFrame(tick);else running=false}
function play(){cancelAnimationFrame(frame);running=true;last=0;frame=requestAnimationFrame(tick)}
function fixedPath(w){
 if(activeMode==='principles'&&[7,3,2,8].includes(w.t))return '';
 const tone=detectTone(w.b);
 if(tone===1||tone===4)return '';
 if(tone===5){const cx=515,cy=202,a=[420,249.5,515,154.5,610,249.5].map((n,i)=>{const center=i%2?cy:cx;return center+(n-center)*.875});return `M ${a[0]} ${a[1]} L ${a[2]} ${a[3]} L ${a[4]} ${a[5]}`}
 // Use the same original tone-symbol geometry as the first syllable,
 // translated to the second column; the final syllable keeps its tone.

}
function syncWordButtons(){for(const rowId of ['words','practiceWords'])[...$(rowId).children].forEach((b,j)=>b.setAttribute('aria-pressed',j===selected));[...$('principlesWords').children].forEach((b,j)=>b.setAttribute('aria-pressed',j===ruleSelected))}
function adjustPrinciplesGap(){
 const graph=$('toneGraphWrap');graph.style.marginTop='0px';
 if(activeMode!=='principles')return;
 if(!graph.getBoundingClientRect)return;
 const box=graph.getBoundingClientRect(),buttons=$('principlesWords').getBoundingClientRect();
 const gap=Math.max(0,box.top+box.width*17.5/680-buttons.bottom);
 graph.style.marginTop=(gap*(.6*1.4*.7-1))+'px';
}
if(typeof window!=='undefined')window.addEventListener('resize',adjustPrinciplesGap);
function showLesson(w){$('poj').className='poj poj-double';$('lastLabel').textContent=activeMode==='principles'?'':w.b;$('original').setAttribute('d',w.t===4||w.t===8?'':w.t===5?roofPath(107):path(firstCurve(w)));$('fixed').setAttribute('d',fixedPath(w));$('firstTone').textContent=`第 ${w.t} 調 → 第 ${w.to} 調`;$('lastTone').textContent=`第 ${w.u} 調（不變）`;$('verseSource').textContent='馬可福音'+w.verse;$('graphDesc').textContent=`${w.h}：第一字第${w.t}調變為第${w.to}調，第二字第${w.u}調保持不變。`;paint();play();adjustPrinciplesGap();}
function chooseRule(i){halt();stopRefresh();ruleSelected=i;pickRuleSample(i);p=0;tab('principles');showLesson(ruleWords[i]);scheduleRefresh()}
function choose(i,mode=activeMode,syncQuiz=true){if(mode==='principles'){chooseRule(i);return}halt();selected=i;p=0;tab(mode);showLesson(words[i]);if(mode==='practice'){if(syncQuiz)restart(i);else if(!$('quizArea').hidden)question()}scheduleRefresh()}
$('speed').onchange=()=>{p=0;paint();play();scheduleRefresh()};document.addEventListener('visibilitychange',()=>{if(document.hidden)halt();else{p=0;paint();play();if(!refreshTimer)scheduleRefresh()}});
function tab(name){$('toneDescriptions').style.display=name==='principles'?'none':'';$('lessonContent').className=name==='principles'?'principles-content':'';$(name==='principles'?'principlesLessonHost':'animationLessonHost').append($('lessonContent'));activeMode=name;for(const id of ['principles','animation','practice']){$(id).hidden=id!==name;$('tab-'+id).setAttribute('aria-selected',id===name)}syncWordButtons()}

let order=[],q=0,score=0,answered=false,quizWords=[],currentCorrect=false;
function restart(preferred){quizWords=words.map(w=>({...w}));order=words.map((_,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}if(Number.isInteger(preferred))order=[preferred,...order.filter(i=>i!==preferred)];q=0;score=0;$('quizArea').hidden=false;$('result').hidden=true;question()}
function confusingAnswers(w){
 const similar={1:[7,2,3,5,8],2:[3,5,7,1],3:[2,5,7,1],4:[7,2,3,5,8],5:[2,3,7,1],7:[1,2,3,5],8:[1,7,2,3]};
 const candidates=[...new Set(similar[w.to].map(t=>respell(w.a,t)))].filter(text=>text!==w.out);
 for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}

function answerMarkup(text,source){const letters=splitLetters(text),marked=accentIndex(text),index=marked>=0?marked:nucleusIndex(source);return letters.map((letter,i)=>i===index?`<span class="answer-vowel">${letter}</span>`:letter).join('')}
function question(){

 $('question').textContent=`${w.h}（${w.source}）\n「${w.a}」→ ？`;$('practiceVerseSource').textContent='馬可福音'+w.verse;$('question').style.whiteSpace='pre-line';$('answers').replaceChildren();$('feedback').textContent='';$('next').disabled=true;$('next').textContent=q===words.length-1?'看成績 →':'下一題 →';

}
$('hint').onclick=()=>{const w=quizWords[order[q]];$('feedback').textContent=w.n};$('next').onclick=()=>{if(!answered)return;if(currentCorrect)score++;q++;if(q<words.length)question();else{$('quizArea').hidden=true;$('result').hidden=false;$('result').innerHTML=`<h2>完成了！答對 ${score} / ${words.length} 題</h2><p>回到動畫，再看看還不熟悉的變調。</p><button class="primary" id="again">再練一次</button>`;$('again').onclick=restart}};restart();choose(0);
